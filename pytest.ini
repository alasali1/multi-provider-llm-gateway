[pytest]
testpaths = tests
# Makes `import gateway` work: the modules sit in the project root
pythonpath = .
addopts = -ra --strict-markers
markers =
    live: hits the real provider APIs (opt-in: RUN_LIVE_TESTS=1 plus real keys; costs money)
    real_deps: runs against the genuine openai/anthropic/httpx/tiktoken packages (no live API calls); errors if they are missing or are stand-ins
    real_tokenizer: uses the real tiktoken encoding instead of the stubbed prompt counter